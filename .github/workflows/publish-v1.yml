name: Publish LORUNEI v1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import pinned v57b3 source
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git clone -q https://github.com/japaninsider/japaninsider.git "$tmp/source"
          git -C "$tmp/source" checkout -q 6c23cd92e940f220c5a706c96b5bfca40dafc76a
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          rsync -a --exclude='.git' --exclude='.github' "$tmp/source/" ./

      - name: Convert to LORUNEI v1
        run: python .github/publish-v1.py

      - name: Validate JavaScript
        shell: bash
        run: |
          node --check assets/js/v1.js
          node --check assets/js/samples-v1.js
          node --check assets/js/payments.js

      - name: Commit v1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "LORUNEI Publisher"
          git config user.email "infolorunei@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No site changes to commit."
            exit 0
          fi
          git commit -m "Publish LORUNEI v1" -m "Reset the dedicated LORUNEI site version to v1, update consultation email to infolorunei@gmail.com, switch Formspree to mjyvgqad, and preserve the validated v57b3 service/content model."
          git push origin main
